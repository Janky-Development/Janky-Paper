group=dev.jankypaper
mcVersion=26.3
# Current API version for use in (paper-)plugin.yml files
apiVersion=26.3
channel=ALPHA

# Janky Paper release number for GitHub releases (.github/workflows/release.yml; read from main only).
# Leave it alone and every release of changed versions takes the next number by itself (1.0 -> 1.0.1 -> 1.0.2).
# Raise it (1.1, 2.0, ...) and the next release uses exactly that number and ships every Minecraft version.
releaseVersion=1.0

# Upstream PaperMC/Paper commit this fork is based on
paperRef=7e88a0da385c201f00011ce5eef1834d391e4023

org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.vfs.watch=false
org.gradle.jvmargs=-Xmx4G
