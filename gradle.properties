# Janky Paper release number for GitHub releases (.github/workflows/release.yml; read from main only).
# Leave it alone and every release of changed versions takes the next number by itself (1.0 -> 1.0.1 -> 1.0.2).
# Raise it (1.1, 2.0, ...) and the next release uses exactly that number and ships every Minecraft version.
# (Each version's own settings - mcVersion, paperRef, ... - are in versions/<version>/gradle.properties.)
releaseVersion=1.0

org.gradle.configuration-cache=true
org.gradle.vfs.watch=false
