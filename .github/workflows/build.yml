name: Patch and Build

on:
  push:
    branches: [ "**" ]
  pull_request:

jobs:
  build:
    # Only run on PRs if the source branch is on someone else's repo
    if: ${{ github.event_name != 'pull_request' || github.repository != github.event.pull_request.head.repo.full_name }}
    runs-on: ubuntu-latest
    env:
      # Janky Paper versions are "<mc>.build.<n>-<channel>" like Paper's; the run number is the build number
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: Checkout Git Repository
        uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Configure Git User Details
        run: git config --global user.email "actions@github.com" && git config --global user.name "GitHub Actions"
      - name: Apply Patches
        run: ./gradlew applyAllPatches --stacktrace
      - name: Build
        run: ./gradlew build --stacktrace
      # The server jar of this branch's Minecraft version; the Release workflow (main) publishes it from here
      - name: Create Paperclip Jar
        run: ./gradlew createPaperclipJar --stacktrace
      - name: Read Minecraft Version
        id: minecraft
        run: echo "version=$(sed -n 's/^mcVersion=//p' gradle.properties | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"
      - name: Upload Paperclip Jar
        uses: actions/upload-artifact@v7
        with:
          name: janky-paper-${{ steps.minecraft.outputs.version }}
          path: |
            janky-paper-server/build/libs/jankypaper-paperclip-*.jar
            !janky-paper-server/build/libs/*-reobf.jar
          if-no-files-found: error
          retention-days: 30
