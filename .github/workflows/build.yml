name: Patch and Build

on:
  push:
    branches: [ "**" ]
  pull_request:

jobs:
  build:
    # Only run on PRs if the source branch is on someone else's repo
    if: ${{ github.event_name != 'pull_request' || github.repository != github.event.pull_request.head.repo.full_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload the server jar to the ci-builds pre-release
    env:
      # Janky Paper versions are "<mc>.build.<n>-<channel>" like Paper's; the run number is the build number
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: Checkout Git Repository
        uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Configure Git User Details
        run: git config --global user.email "actions@github.com" && git config --global user.name "GitHub Actions"
      # Commits made on Windows (core.filemode=false) keep losing gradlew's executable bit: don't depend on it
      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew
      - name: Apply Patches
        run: ./gradlew applyAllPatches --stacktrace
      - name: Build
        run: ./gradlew build --stacktrace
      # The server jar of this branch's Minecraft version; the Release workflow (main) publishes it from here
      - name: Create Paperclip Jar
        run: ./gradlew createPaperclipJar --stacktrace
      - name: Read Minecraft Version
        id: minecraft
        run: echo "version=$(sed -n 's/^mcVersion=//p' gradle.properties | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"
      # Kept as an asset of the "ci-builds" pre-release, not as an Actions artifact: release assets don't count against
      # the Actions storage quota (0.5 GB on the free plan, about 8 jars). Only for pushes to the version branches.
      - name: Upload Paperclip Jar
        if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/ver/')) }}
        env:
          GH_TOKEN: ${{ github.token }}
          MINECRAFT: ${{ steps.minecraft.outputs.version }}
        run: |
          set -euo pipefail
          jar=$(ls janky-paper-server/build/libs/jankypaper-paperclip-*.jar | grep -v -- '-reobf\.jar$' | head -n 1)
          name="janky-paper-$MINECRAFT-$GITHUB_SHA.jar"
          cp "$jar" "$RUNNER_TEMP/$name"
          gh release view ci-builds >/dev/null 2>&1 || gh release create ci-builds --prerelease --latest=false \
            --target "${{ github.event.repository.default_branch }}" --title "Development builds (CI)" \
            --notes "The newest server jar CI built for each Minecraft version branch: untested in game and not a release. The Release workflow publishes the real releases from here. File names are janky-paper-<minecraft version>-<commit>.jar." \
            || gh release view ci-builds >/dev/null # another branch's CI created it at the same moment
          gh release upload ci-builds "$RUNNER_TEMP/$name" --clobber
          # keep only the newest jar of this Minecraft version
          gh release view ci-builds --json assets -q '.assets[].name' > "$RUNNER_TEMP/assets.txt"
          for old in $(grep -E "^janky-paper-${MINECRAFT//./\\.}-[0-9a-f]{40}\.jar$" "$RUNNER_TEMP/assets.txt" | grep -vxF "$name" || true); do
            gh release delete-asset ci-builds "$old" --yes
          done
