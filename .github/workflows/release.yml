name: Release

# After CI ("Patch and Build") finishes for a push to main - or by hand from the Actions tab:
#   1. release: publishes the server jars of the Minecraft versions whose code changed (.github/scripts/release.py);
#      a version is only released from a jar CI built from exactly its current code, so only tested code ships.
#   2. sync: updates each ver/* mirror branch to its version's newest released code (janky_lines.py sync), as a
#      commit authored like the main commit it comes from.
# CI's outcome does not matter here: a version whose build failed has no jar of its current code and simply waits;
# the others are released.
on:
  workflow_run:
    workflows: [ "Patch and Build" ]
    types: [ completed ]
    branches: [ main ]
  workflow_dispatch:
    inputs:
      full:
        description: "Ship every Minecraft version, even the unchanged ones (without raising releaseVersion)"
        type: boolean
        default: false
      dry_run:
        description: "Only show what would be released and synced"
        type: boolean
        default: false

# One release at a time; pushes that land meanwhile are picked up by the queued run.
concurrency:
  group: janky-release
  cancel-in-progress: false

permissions:
  contents: write # create releases and tags, push the mirror branches

jobs:
  release:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion != 'cancelled') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Git Repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0 # main's history and the mirror branches
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          FULL_RELEASE: ${{ inputs.full }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python .github/scripts/release.py
      - name: Configure Git User Details
        run: git config --global user.email "actions@github.com" && git config --global user.name "GitHub Actions"
      - name: Sync Mirror Branches
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python .github/scripts/janky_lines.py sync
